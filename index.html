<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🏓 Ténis de Mesa</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a7a3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ténis de Mesa" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #2d6a40;
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #root {
      max-width: 740px;
      margin: 0 auto;
      background: #f4f7f4;
      min-height: 100vh;
    }
    /* Desktop: adiciona sombra e margem vertical */
    @media (min-width: 800px) {
      body {
        background: linear-gradient(160deg, #1a5a2a 0%, #2d8a4a 50%, #1a5a2a 100%);
        min-height: 100vh;
        padding: 30px 20px;
      }
      #root {
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0,0,0,.3);
        min-height: auto;
      }
    }
    #loading {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; flex-direction: column; gap: 12px;
      font-family: 'Courier New', monospace; color: #fff; font-size: 14px;
      background: #1a7a3a;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="loading">
      <span style="font-size:48px">🏓</span>
      <span>A carregar...</span>
    </div>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script>
    // Confirma que React carregou antes de avançar
    if (typeof React === 'undefined') {
      document.getElementById('loading').innerHTML = '<span style="font-size:32px">❌</span><span>Erro a carregar React.<br>Verifica a ligação e recarrega.</span>';
    }
  </script>
  <script src="app.js?v=6"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        // Desregista service workers antigos primeiro
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) { reg.unregister(); });
        });
        // Regista o novo
        navigator.serviceWorker.register('sw.js').catch(function(){});
      });
    }
  </script>
</body>
</html>
