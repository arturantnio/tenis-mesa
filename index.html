<!DOCTYPE html>

<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🏓 Ténis de Mesa</title>

  <!-- PWA -->

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a7a3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ténis de Mesa" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a7a3a;
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #root { max-width: 500px; margin: 0 auto; background: #f4f7f4; min-height: 100vh; }
  </style>

</head>
<body>
  <div id="root"></div>
  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(r => console.log('SW registado:', r.scope))
          .catch(e => console.log('SW erro:', e));
      });
    }
  </script>
</body>
</html>
